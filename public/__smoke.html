<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>smoke</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; }
      iframe { width: 100%; height: 100vh; border: 0; display: block; }
      #dbg {
        position: fixed; left: 8px; top: 8px; z-index: 9999;
        color: #0f0; background: #000; font: 13px monospace; padding: 6px;
        white-space: pre; max-width: 640px;
      }
    </style>
  </head>
  <body>
    <div id="dbg">boot</div>
    <iframe id="f" src="/"></iframe>
    <script>
      const progress = Number(new URLSearchParams(location.search).get("p") || "0.719");
      document.getElementById("f").addEventListener("load", () => {
        setTimeout(() => {
          const win = document.getElementById("f").contentWindow;
          const doc = win.document;
          const track = doc.querySelector(".laptop-track");
          const dbg = document.getElementById("dbg");
          if (!track) { dbg.textContent = "NO_TRACK"; return; }
          const top = track.getBoundingClientRect().top + win.scrollY;
          const start = top - win.innerHeight;
          doc.documentElement.style.scrollBehavior = "auto";
          win.scrollTo({ top: start + track.offsetHeight * progress, behavior: "instant" });
          setTimeout(() => {
            const active = doc.querySelector(".project-panel.is-active");
            const link = active && active.querySelector("a[href]");
            const lines = [];
            if (!link) {
              const anyActive = doc.querySelector(".is-active");
              lines.push("NO_ACTIVE_LINK anyActive=" + (anyActive ? anyActive.className : "no"));
              const label = doc.querySelector("[data-rail-label]");
              lines.push("label=" + (label ? label.textContent : "?"));
              const ps = [...doc.querySelectorAll("[data-panel]")];
              lines.push("panels=" + ps.map((p) => p.className + "|op=" + parseFloat(win.getComputedStyle(p).opacity).toFixed(2)).join(" ; "));
            } else {
              const r = link.getBoundingClientRect();
              const cx = r.left + r.width / 2;
              const cy = r.top + r.height / 2;
              const hit = doc.elementFromPoint(cx, cy);
              const pl = active ? win.getComputedStyle(active) : null;
              lines.push("link href=" + link.href);
              lines.push("link rect=" + Math.round(r.left) + "," + Math.round(r.top) + " " + Math.round(r.width) + "x" + Math.round(r.height));
              lines.push("hit=" + (hit ? hit.tagName + "." + (hit.className && hit.className.baseVal !== undefined ? hit.className.baseVal : hit.className) : "null"));
              lines.push("sameOrInside=" + !!(hit && (hit === link || link.contains(hit) || hit.contains(link))));
              lines.push("panel pointerEvents=" + (pl ? pl.pointerEvents : "?"));
              lines.push("link pointerEvents=" + win.getComputedStyle(link).pointerEvents);
              lines.push("panel opacity=" + (pl ? pl.opacity : "?"));
              const stack = [];
              let el = hit;
              while (el && stack.length < 6) {
                stack.push(el.tagName + (el.className ? "." + String(el.className).split(" ")[0] : ""));
                el = el.parentElement;
              }
              lines.push("hit chain: " + stack.join(" > "));
            }
            dbg.textContent = lines.join("\n");
          }, 7500);
        }, 1200);
      });
    </script>
  </body>
</html>
