<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>smoke</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; }
      iframe { width: 100%; height: 100vh; border: 0; display: block; }
      #dbg {
        position: fixed; left: 8px; top: 8px; z-index: 9999;
        color: #0f0; background: #000; font: 14px monospace; padding: 6px;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div id="dbg">boot</div>
    <iframe id="f" src="/"></iframe>
    <script>
      const progress = Number(new URLSearchParams(location.search).get("p") || "0.32");
      document.getElementById("f").addEventListener("load", () => {
        setTimeout(() => {
          const win = document.getElementById("f").contentWindow;
          const doc = win.document;
          const track = doc.querySelector(".laptop-track");
          const dbg = document.getElementById("dbg");
          if (!track) { dbg.textContent = "NO_TRACK"; return; }
          const top = track.getBoundingClientRect().top + win.scrollY;
          const range = track.offsetHeight - win.innerHeight;
          doc.documentElement.style.scrollBehavior = "auto";
          win.scrollTo({ top: top + range * progress, behavior: "instant" });
          const after = win.scrollY;
          setTimeout(() => {
            const label = doc.querySelector("[data-rail-label]");
            const panels = [...doc.querySelectorAll("[data-panel]")].map(
              (p) => `${p.getAttribute("data-panel")}:${parseFloat(win.getComputedStyle(p).opacity).toFixed(2)}`
            ).join(" ");
            dbg.textContent =
              `target_p=${progress}\n` +
              `trackTop=${Math.round(top)} range=${Math.round(range)}\n` +
              `scrollY after=${Math.round(after)} now=${Math.round(win.scrollY)}\n` +
              `real_p=${((win.scrollY - top) / range).toFixed(3)}\n` +
              `label=${label ? label.textContent : "?"}\n` +
              panels;
          }, 500);
        }, 1200);
      });
    </script>
  </body>
</html>
